name: six-stage-devsecops

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: "1 / Secrets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Block detected secrets
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a
          detect --source=/repo --redact --no-banner --exit-code=1

  sast:
    name: "2 / SAST"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Block high-confidence code findings
        run: >-
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
          semgrep scan --config p/default --error --severity ERROR
          --exclude .terraform --exclude tests/fixtures /src

  dependencies:
    name: "3 / Dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Block critical dependency vulnerabilities
        run: >-
          docker run --rm -v "$PWD:/work" aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          fs --scanners vuln --severity CRITICAL --exit-code 1
          --skip-dirs .terraform /work

  dockerfiles:
    name: "4 / Dockerfiles"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enforce Dockerfile hardening
        run: >-
          docker run --rm -i hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
          hadolint --failure-threshold error -
          < monitoring-platform/Dockerfile

  kubernetes:
    name: "5 / Kubernetes and RBAC"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Block high-risk workload and RBAC findings
        run: >-
          python -m security_platform.scanners.kubernetes_scanner monitoring-platform/k8s
          --fail-on HIGH --format json --output reports/kubernetes.json

  terraform:
    name: "6 / Terraform"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
      - name: Run custom 21-rule scanner
        run: >-
          python -m security_platform.scanners.terraform_scanner modules examples
          --fail-on HIGH --format json --output reports/terraform.json
      - name: Run scanner regression tests
        run: python -m unittest tests.test_security_platform.TerraformScannerTests -v
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Validate and test secure backup module
        run: |
          terraform -chdir=modules/aws-secure-backup init -backend=false
          terraform -chdir=modules/aws-secure-backup validate
          terraform -chdir=modules/aws-secure-backup test
      - name: Validate AWS security lab
        run: |
          terraform -chdir=examples/aws-security-lab init -backend=false
          terraform -chdir=examples/aws-security-lab validate

  deployment-gate:
    name: Deployment security gate
    if: always()
    needs: [secrets, sast, dependencies, dockerfiles, kubernetes, terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Require all six controls
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$RESULTS" = "success,success,success,success,success,success"
          echo "All six security stages passed; deployment may proceed."

  build-publish-deploy:
    name: Build, publish, deploy and smoke test
    needs: [deployment-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cloud-security-monitoring:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build immutable application image
        run: >-
          docker build
          --label org.opencontainers.image.revision=${{ github.sha }}
          --tag "$IMAGE"
          monitoring-platform
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish commit-addressed image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"
      - name: Deploy gated image to ephemeral environment
        id: deploy
        run: |
          docker run --detach --name monitoring-platform \
            --publish 127.0.0.1::8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            "$IMAGE"
          host_port=$(docker port monitoring-platform 8080/tcp | sed 's/.*://')
          test -n "$host_port"
          echo "host_port=$host_port" >> "$GITHUB_OUTPUT"
      - name: Smoke test deployed workload
        env:
          HOST_PORT: ${{ steps.deploy.outputs.host_port }}
        run: |
          for attempt in $(seq 1 30); do
            if response=$(curl --fail --silent --show-error "http://127.0.0.1:$HOST_PORT/healthz"); then
              test "$response" = '{"status": "ok"}'
              echo "Deployment smoke test passed for $IMAGE"
              exit 0
            fi
            if test "$(docker inspect --format='{{.State.Running}}' monitoring-platform)" != "true"; then
              docker logs monitoring-platform
              exit 1
            fi
            sleep 1
          done
          docker logs monitoring-platform
          exit 1
      - name: Record deployment evidence
        run: |
          image_id=$(docker image inspect "$IMAGE" --format '{{.Id}}')
          container_id=$(docker inspect monitoring-platform --format '{{.Id}}')
          {
            echo "### Ephemeral deployment evidence"
            echo "- Image: \`$IMAGE\`"
            echo "- Image ID: \`$image_id\`"
            echo "- Container ID: \`$container_id\`"
            echo "- Health endpoint: \`/healthz\` passed"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up ephemeral deployment
        if: always()
        run: docker rm --force monitoring-platform || true
