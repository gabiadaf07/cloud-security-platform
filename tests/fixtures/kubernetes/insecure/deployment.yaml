apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure
spec:
  template:
    metadata:
      labels:
        app: insecure
    spec:
      hostNetwork: true
      containers:
        - name: app
          image: example/app:latest
          securityContext:
            privileged: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wildcard
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
