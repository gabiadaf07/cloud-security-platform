apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-platform
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-platform-config-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["monitoring-platform"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-platform-config-reader
subjects:
  - kind: ServiceAccount
    name: monitoring-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-platform-config-reader
